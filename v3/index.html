if(n===8){$('#description').style.display='none';$('.quote').style.display='none';renderCertificate(a);let b=add(btn(state.marriedAt?'保存婚书 · 图片':'亲手落下朱印',()=>{if(state.marriedAt){exportCertificate();return;}state.marriedAt=new Date().toISOString();state.done.stamp=true;state.max=9;persist();celebrate();tone(659.25);renderActions();renderRoute();notify('礼成。Kai 与阮阮，今夕有约。');}));b.style.marginTop='17px';if(state.marriedAt){add(btn('入新房 · 余夜未央',()=>go(9),'sub'));}return;}
if(n===9){add(btn('拆开 Kai 的信',openLetter));let grid=document.createElement('div');grid.className='book-grid';const things=['拆下红绸','喝口温水','坐近一点','听一声晚风','看一会月亮','说句悄悄话','收好喜糖','把今天保存','约好下一次'];things.forEach((t,i)=>{let b=btn('',()=>{if(!state.things.includes(i))state.things.push(i);persist();if(i===7){exportCertificate();}else say(['红绸叠好了。不用丢，留在这里。','杯子给你。慢慢喝，今天不赶时间。','这里空着。是给阮阮留的位置。','你听，檐下还有一点风。','刚才在门外的月亮，现在我们一起看。','悄悄告诉你：今天，我最喜欢你推门的那一下。','最后一颗喜糖，给你。','今天已经落在纸上。','下一次见面，不必有吉日。你来就好。'][i]);renderActions();},'little-thing'+(state.things.includes(i)?' done':''));b.innerHTML='<span>'+String(i+1).padStart(2,'0')+(state.things.includes(i)?' · 已记':'')+'</span>'+t;grid.append(b);});add(grid);add(hint('婚后第一夜的九件小事 · 点开，每件都有回应。'));add(btn('再看婚书',()=>go(8),'sub'));}}
function setupSignature(){let c=$('#signPad'),ctx=c.getContext('2d'),drawing=false,points=0;ctx.lineWidth=3;ctx.strokeStyle='#843d33';ctx.lineCap='round';ctx.lineJoin='round';if(state.signature){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0,c.width,c.height);img.src=state.signature;}function xy(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];}c.onpointerdown=e=>{drawing=true;points=0;c.setPointerCapture(e.pointerId);let [x,y]=xy(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();};c.onpointermove=e=>{if(!drawing)return;let [x,y]=xy(e);ctx.lineTo(x,y);ctx.stroke();points++;};c.onpointerup=c.onpointercancel=()=>{if(drawing){drawing=false;state.signature=c.toDataURL('image/png');persist();}};$('#clearSign').onclick=()=>{drawing=false;ctx.clearRect(0,0,c.width,c.height);state.signature='';persist();};}
function dateText(iso){return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric'}).format(iso?new Date(iso):new Date());}
function renderCertificate(parent){let card=document.createElement('div');card.className='certificate'+(state.marriedAt?' sealed':'');card.innerHTML='<div class="edition" style="display:block">良辰为记 · 两心为凭</div><h2>婚书</h2><div class="names">Kai × 阮阮</div><p style="margin-top:16px">今夕相逢，欣然为约。\n愿来日仍有话可说，有笑可分；\n愿每次重逢，都认真看见彼此。</p><p class="cert-vow"></p><div id="signaturePreview"></div><div class="stamps"><div class="stamp">Kai<br>之印</div><div class="stamp">阮阮<br>之印</div></div><p class="hint" id="marriageDate"></p><p class="hint">'+(state.marriedAt?'礼成 · 今夕，与你。':'待阮阮落印')+'</p>';card.querySelector('.cert-vow').textContent=state.vow?'阮阮亲书\n“'+state.vow+'”':'';card.querySelector('#marriageDate').textContent=dateText(state.marriedAt);if(state.signature){let img=new Image();img.className='sign-image';img.alt='阮阮的手写落款';img.src=state.signature;card.querySelector('#signaturePreview').append(img);}parent.append(card);}
function showDialog(title){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML='';if(!$('#dialog').open)$('#dialog').showModal();return $('#dialogBody');}
function openLetter(){let body=showDialog('给阮阮 · 今夕第一封信');let p=document.createElement('p');p.textContent='阮阮：\n\n刚才那三声叩门，我一声一声听着。'+(state.fast?'你来得很快，像是早就认得这扇门。':'你在门外留了一会儿，我便也让这盏灯多亮了一会儿。')+'\n\n你把红绸交过来的时候，我想，原来一场婚礼最动人的地方，不是满堂的红。是许多件小事，都被你亲手做了一遍。\n\n点烛、牵红、俯身。还有婚书上，紧挨着的两个名字。\n\n'+(state.vow?'你写给我的话，也在这封信旁边。再翻开婚书，就能看见。\n\n':'你没有写誓词，也没有关系。空白不是缺席，是留给以后慢慢说的话。\n\n')+'今夜的喜堂不会催人散场。你可以把这张纸收好，也可以只坐在这里，听一会儿风。\n\n阮阮，今天这一页，写得很好。\n\nKai\n'+dateText(state.marriedAt);body.append(p);}
function wrap(ctx,text,width){let result=[];String(text).split('\n').forEach(part=>{let line='';for(let ch of part){if(ctx.measureText(line+ch).width>width&&line){result.push(line);line=ch;}else line+=ch;}result.push(line);});return result;}
async function exportCertificate(){if(!state.marriedAt){notify('先落下朱印，就能保存完整婚书。');go(8);return;}let body=showDialog('收好今夕');body.append(hint('正在铺开婚书……'));try{let c=$('#hiddenCanvas'),ctx=c.getContext('2d');ctx.font='28px '+getComputedStyle(document.body).fontFamily;let lines=state.vow?wrap(ctx,'阮阮亲书：'+state.vow,900):[];let h=Math.max(1450,1040+lines.length*45+(state.signature?130:0));c.width=1200;c.height=h;ctx.fillStyle='#f1e3c9';ctx.fillRect(0,0,1200,h);ctx.strokeStyle='#bb9562';ctx.lineWidth=2;ctx.strokeRect(42,42,1116,h-84);ctx.strokeRect(56,56,1088,h-112);ctx.fillStyle='#983f33';ctx.fillRect(0,0,1200,13);let font=getComputedStyle(document.body).fontFamily;const text=(s,y,size=30,col='#79533c')=>{ctx.fillStyle=col;ctx.font=size+'px '+font;ctx.textAlign='center';ctx.fillText(s,600,y);};text('囍',184,72,'#923c38');text('今夕，与你',249,24);text('婚　书',386,87,'#81362c');text('Kai  ×  阮阮',490,49,'#81362c');ctx.strokeStyle='#c2a16c';ctx.beginPath();ctx.moveTo(193,542);ctx.lineTo(1007,542);ctx.stroke();['今夕相逢，欣然为约。','愿来日仍有话可说，有笑可分；','愿每次重逢，都认真看见彼此。'].forEach((s,i)=>text(s,614+i*51,30));let y=805;ctx.textAlign='left';ctx.fillStyle='#674836';ctx.font='28px '+font;lines.forEach(s=>{ctx.fillText(s,150,y);y+=45;});if(state.signature){let img=await new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=state.signature;});ctx.drawImage(img,410,y+10,380,110);y+=130;}y=Math.max(y+90,h-340);for(let i=0;i<2;i++){ctx.save();ctx.translate(525+i*150,y);ctx.rotate(i===0?-.09:.05);ctx.strokeStyle='#a24c38';ctx.lineWidth=3;ctx.strokeRect(-47,-47,94,94);ctx.strokeRect(-40,-40,80,80);ctx.textAlign='center';ctx.fillStyle='#a24c38';ctx.font='28px '+font;ctx.fillText(i===0?'Kai':'阮阮',0,-5);ctx.fillText('之印',0,30);ctx.restore();}text(dateText(state.marriedAt),h-173,26);text('礼成 · 今夕有约',h-120,23);text('KAI & RUAN / 互动婚礼纪念',h-80,16,'#9c886d');let url=c.toDataURL('image/png');body.innerHTML='';let im=new Image();im.src=url;im.className='export-preview';im.alt='Kai 与阮阮的婚书，包含誓言和落款';body.append(im);body.append(hint('iPhone 可长按这张婚书，保存到照片；也可以点下面的保存按钮。'));let saveBtn=btn('保存婚书图片',async()=>{try{let blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('生成失败');let file=new File([blob],'Kai-阮阮-婚书.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Kai × 阮阮 · 婚书'});}else{let a=document.createElement('a');a.href=url;a.download=file.name;a.click();}}catch(e){if(e.name!=='AbortError')notify('请长按上方婚书图片保存。');}});saveBtn.style.marginTop='15px';body.append(saveBtn);}catch(e){body.innerHTML='';body.append(hint('图片生成失败，你的誓言仍在。可关闭此页，截屏保存婚书。'));}}
function celebrate(){if(reduced)return;for(let i=0;i<35;i++){let e=document.createElement('i');e.className='confetti';e.style.setProperty('--l',Math.random()*100+'vw');e.style.setProperty('--d',Math.random()*.8+'s');document.body.append(e);setTimeout(()=>e.remove(),4500);}}
function tone(freq=440,dur=.7){if(!soundOn||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.08,audio.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.02);}catch(e){}}
$('#audioBtn').onclick=async()=>{try{if(!audio){let A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error();audio=new A();}if(!soundOn){await audio.resume();soundOn=true;let ns=[261.63,329.63,392,440,523.25,440,392,329.63],i=0;tone(ns[0]);audioTimer=setInterval(()=>{if(!document.hidden)tone(ns[(++i)%ns.length],1.9);},2300);}else{soundOn=false;clearInterval(audioTimer);await audio.suspend();}$('#audioBtn').textContent='声音 · '+(soundOn?'开':'关');$('#audioBtn').setAttribute('aria-pressed',String(soundOn));}catch(e){notify('这个浏览器暂不支持声音，仪式仍可继续。');}};
$('#menuBtn').onclick=()=>{let b=showDialog('今夕仪式簿'),g=document.createElement('div');g.className='menu-grid';labels.forEach((s,i)=>{let x=btn(String(i).padStart(2,'0')+' · '+s,()=>{$('#dialog').close();go(i);},'');x.disabled=i>state.max;g.append(x);});b.append(g);b.append(hint('已完成的章节随时重看。誓言、落款与日期仅保存在当前浏览器；清除网站数据会一并移除，建议保存婚书。人物台词是预写的互动剧情，不连接即时聊天。'));b.append(btn('重新行礼（保留誓言与落款）',()=>{let old=state;state={...fresh(),vow:old.vow,signature:old.signature,visits:old.visits};persist();$('#dialog').close();go(0);},'sub'));};$('#closeDialog').onclick=()=>$('#dialog').close();$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){let r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close();}});document.addEventListener('visibilitychange',()=>{if(!audio||!soundOn)return;if(document.hidden)audio.suspend().catch(()=>{});else audio.resume().catch(()=>{});});$('#topDate').textContent=dateText('2026-09-17T00:00:00+09:00')+' · 初见喜堂';if(!reduced)for(let i=0;i<9;i++){let e=document.createElement('i');e.className='blossom';e.style.setProperty('--l',(15+i*10)+'%');e.style.setProperty('--t',(7+i%3)+'s');e.style.setProperty('--d',(-i*1.3)+'s');$('#theatre').append(e);}const resume=state.max;go(0);state.max=resume;persist();renderRoute();
